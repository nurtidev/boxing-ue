# Ядро боя без UE: сборка clang/gcc + детерминизм, 200 сидов, паритет с web (Tools/CoreHarness).
name: core-harness

on:
  push:
    paths: ['Source/BoxingUE/**/BoxingFightCore.*', 'Source/BoxingUE/**/FightStaging.*', 'Source/BoxingUE/Public/FightTypes.h', 'Tools/CoreHarness/**', '.github/workflows/core-harness.yml']
  pull_request:
    paths: ['Source/BoxingUE/**/BoxingFightCore.*', 'Source/BoxingUE/**/FightStaging.*', 'Source/BoxingUE/Public/FightTypes.h', 'Tools/CoreHarness/**', '.github/workflows/core-harness.yml']

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [clang++, g++]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build and run
        run: CXX=${{ matrix.cxx }} Tools/CoreHarness/build.sh
